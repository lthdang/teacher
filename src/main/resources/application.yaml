spring:
  application:
    name: teach_management

  datasource:
    url: "${teach_management.db.url}"
    username: "${teach_management.db.user}"
    password: "${teach_management.db.password}"
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    enabled: true
    default-schema: "${teach_management.db.default_schema}"
    schemas: "${teach_management.db.default_schema}"
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        default_schema: "${teach_management.db.default_schema}"

logging:
  level:
    org.flywaydb: DEBUG

eureka:
  client:
    enabled: false

server:
  port: 8080

teach_management:
  db:
    host: "${POSTGRES_DB_HOST:127.0.0.1}"
    port: "5432"
    name: "${POSTGRES_DB:teach-management-db}"
    user: "${POSTGRES_USER:root}"
    password: "${POSTGRES_PASSWORD:password}"
    default_schema: teach_management
    url: jdbc:postgresql://${teach_management.db.host}:${teach_management.db.port}/${teach_management.db.name}
