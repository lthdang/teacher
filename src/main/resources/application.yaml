spring:
  application:
    name: teacher

  datasource:
    url: "${teacher.db.url}"
    username: "${teacher.db.user}"
    password: "${teacher.db.password}"
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    enabled: true
    default-schema: "${teacher.db.default_schema}"
    schemas: "${teacher.db.default_schema}"
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        default_schema: "${teacher.db.default_schema}"

logging:
  level:
    org.flywaydb: DEBUG

eureka:
  client:
    enabled: false

server:
  port: 8080

jwt:
  secret: "${JWT_SECRET:changeme-please-use-a-long-random-secret-key-for-hs256-at-least-32-chars}"
  expiration-ms: 86400000   # 24 hours

teacher:
  db:
    host: "${POSTGRES_DB_HOST:127.0.0.1}"
    port: "5432"
    name: "${POSTGRES_DB:teacher-db}"
    user: "${POSTGRES_USER:root}"
    password: "${POSTGRES_PASSWORD:password}"
    default_schema: teacher
    url: jdbc:postgresql://${teacher.db.host}:${teacher.db.port}/${teacher.db.name}
