version: "3.9"

services:
  teach-management-db:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME}.teach-management-db
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/backup:/home/backup
    ports:
      - "${POSTGRES_ACCESS_PORT}:5432"
    env_file:
      - .env
